name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEIGHTS_CACHE_KEY: weights-e596f507-v1

jobs:
  build-and-verify:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache FP32 Hugging Face checkpoint
        id: weights
        uses: actions/cache@v4
        with:
          path: weights
          key: ${{ env.WEIGHTS_CACHE_KEY }}

      - name: Download FP32 checkpoint
        if: steps.weights.outputs.cache-hit != 'true'
        run: scripts/download_weights.sh

      - name: Run tests
        run: swift test -c release

      - name: Build and verify .ae8 release pack
        run: scripts/build_release_pack.sh

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/arctic-embed-s-ae8.tar.gz \
              dist/model.ae8 \
              dist/vocab.txt \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "$TAG" \
              dist/arctic-embed-s-ae8.tar.gz \
              dist/model.ae8 \
              dist/vocab.txt \
              dist/SHA256SUMS \
              --title "Snowflake Arctic-Embed-S Int8 Weights ($TAG)" \
              --notes "Deterministic SmoothQuant (alpha = 0.40) Int8 model.ae8 pack, vocab.txt, and FP32/FP64 reference test vectors."
          fi
